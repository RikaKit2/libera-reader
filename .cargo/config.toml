[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"
opt-level = 1

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
strip = true
rustflags = ["-Ctarget-cpu=native", "-Ctarget-feature=+aes,+sse2,+avx2,+vaes"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--ld-path=wild"]
