[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"
panic = "unwind"
lto = false
strip = false
debug = true

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
strip = "symbols"
panic = "abort"
debug = false
#rustflags = ["-Ctarget-cpu=native"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--ld-path=wild", "-Ctarget-cpu=native", "-Clink-arg=-Wl,-O2"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"
