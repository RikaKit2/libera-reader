[env]
RUSTC_BOOTSTRAP = "1"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "target-cpu=native",
  "-C", "link-arg=-fuse-ld=mold",
  "-Zshare-generics=y",
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-Wl,--compress-debug-sections=zlib",
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "target-feature=+aes,+sse2"]

[alias]
run-dev = "run --package libera-reader --features dev"
build-dev = "build --package libera-reader --features dev"

run-prof = "run --profile profiling --package libera-reader --features dev"
build-prof = "build --profile profiling --package libera-reader --features dev"

[profile.dev]
lto = false
panic = "unwind"
strip = "none"
debug = 2
split-debuginfo = "unpacked"
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
opt-level = 3
lto = false
panic = "unwind"
strip = "none"
debug = "limited"
split-debuginfo = "off"
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
opt-level = 3
