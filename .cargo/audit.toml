[advisories]
ignore = [
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0097",
    # RUSTSEC-2026-0173: proc-macro-error2 is unmaintained.
    # Comes via gpui -> stacksafe -> stacksafe-macro.
    # No newer version exists; only a warning, not a vulnerability.
    "RUSTSEC-2026-0173",
    # RUSTSEC-2026-0194/0195: quick-xml quadratic time / unbounded namespace DoS.
    # v0.30.0 via xcb -> zed-scap -> gpui.
    # v0.39.4 via zbus_xml / wayland-scanner -> gpui_linux.
    # Both come from gpui/zed, cannot fix ourselves.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0192: ttf-parser is unmaintained.
    # Comes via rustybuzz / fontdb -> gpui. Cannot fix ourselves.
    "RUSTSEC-2026-0192",
    # RUSTSEC-2026-0206: rustybuzz is unmaintained.
    # Comes via usvg / resvg -> gpui. Cannot fix ourselves.
    "RUSTSEC-2026-0206",
]

[yanked]
# The `spin` crate is yanked on crates.io. It is pulled in by gpui (0.10.0)
# and by flume -> scheduler -> gpui (0.9.8). We cannot upgrade it ourselves
# because it is a transitive dependency of gpui; the fix must happen upstream
# in gpui. We disable the yanked-crate check rather than ignore a specific
# crate, since cargo-audit does not support per-crate yanked ignores.
enabled = false
