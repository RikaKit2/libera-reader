[package]
name = "libera-reader-egui"
version = "0.1.0"
authors = ["RikaKit2"]
license = "AGPL-3"
repository = "https://github.com/RikaKit2/libera-reader"
edition = "2021"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true

[dependencies]
egui = "0.31.0"
eframe = { version = "0.31.0", features = [
    "default_fonts", # Embed the default egui fonts.
    "wgpu", # Use the glow rendering backend. Alternative: "wgpu".
    "persistence", # Enable restoring app state when restarting the app.
] }

egui_extras = { version = "0.31.0", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] }
lazy_static = "1.5"
once_cell = "1"
egui_virtual_list = "0.7.0"
libera-reader-core = { version = "0.0.2", path = "../libera-reader-core" }
concurrent-queue = "2.5.0"
rfd = "0.15.3"
