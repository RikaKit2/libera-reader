name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable dev debug symbols to keep Cargo build caches compact and under the 10 GB limit
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies & Wild linker (Linux)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            mupdf-tools
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          curl -sSL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild
          sudo ln -sf /usr/local/bin/wild /usr/local/bin/ld.wild
          wild --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies & Wild linker (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            mupdf-tools
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          curl -sSL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild
          sudo ln -sf /usr/local/bin/wild /usr/local/bin/ld.wild
          wild --version
      - name: Disable Windows Defender for build folders
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath $PWD, $env:USERPROFILE\.cargo, $env:USERPROFILE\.rustup
      - name: Install mutool (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco feature disable -n showDownloadProgress
            try {
              choco install -y mupdf
            } catch {
              try {
                choco install -y mupdf-tools
              } catch {
                Write-Host 'choco install failed, continuing'
              }
            }
          } else {
            Write-Host 'Chocolatey not installed on runner — skipping mutool install'
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Tests
        run: cargo test --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies & Wild linker (Linux)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            mupdf-tools
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          curl -sSL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild
          sudo ln -sf /usr/local/bin/wild /usr/local/bin/ld.wild
          wild --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate Code Coverage
        run: cargo llvm-cov --workspace --locked --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: false
