name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-C target-feature=+aes,+sse2"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cargo registry, git and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.os }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          MAX_TRIES=3
          tries=0
          until [ $tries -ge $MAX_TRIES ]; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev mupdf-tools && break
            tries=$((tries+1))
            echo "apt-get install failed, retrying ($tries/$MAX_TRIES)"
            sleep 5
          done
          sudo apt-get -y autoremove
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
      - name: Install mutool (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco feature disable -n showDownloadProgress
            try {
              choco install -y mupdf
            } catch {
              try {
                choco install -y mupdf-tools
              } catch {
                Write-Host 'choco install failed, continuing'
              }
            }
          } else {
            Write-Host 'Chocolatey not installed on runner — skipping mutool install'
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cargo registry, git and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-coverage
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          MAX_TRIES=3
          tries=0
          until [ $tries -ge $MAX_TRIES ]; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev mupdf-tools && break
            tries=$((tries+1))
            echo "apt-get install failed, retrying ($tries/$MAX_TRIES)"
            sleep 5
          done
          sudo apt-get -y autoremove
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true
